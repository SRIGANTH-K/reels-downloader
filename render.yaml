services:
  - type: web
    name: instagram-downloader-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
      - key: TRUST_PROXY
        value: "1"
      - key: FRONTEND_URL
        sync: false
